server:
  port: ${SERVER_PORT:8090}

spring:
  profiles:
    # 默认 dev（验证码明文返回，方便联调）。激活 dev 时会一并激活 local，
    # 用于加载 application-local.yml 里的个人本地配置（该文件已被 .gitignore 忽略）。
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      dev: local
  application:
    name: medknow-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/medknow?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8}
    username: ${DB_USERNAME:medknow}
    password: ${DB_PASSWORD:medknow123}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    # 生产环境务必用 JWT_SECRET 环境变量覆盖（HS256 要求密钥不短于 32 字节）
    secret: ${JWT_SECRET:MedKnow2026-JwtSecret-Key-For-Dev-Only-ChangeInProd-0123456789}
    expire-days: 7
  # 相对路径，按启动时的工作目录解析；IDEA/mvn 从 backend/ 启动时即 backend/upload/avatars
  upload-dir: ${UPLOAD_DIR:./upload/avatars}
